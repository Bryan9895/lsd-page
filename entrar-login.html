<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
        <link rel="stylesheet" href="./src/css/styles.css">
        <link rel="stylesheet" href="./src/css/auth.css">
        <title>Entrar — LSD</title>
    </head>

    <body class="auth-body">
        <div class="auth-wrapper">

            <aside class="auth-marca">
                <a href="index.html" class="auth-marca-logo">
                    <img src="./src/images/LOGO_LSD.svg" alt="Logo LSD">
                    <div class="logo-subtexto">
                        <span>Sistemas</span>
                        <span>&amp; Dados</span>
                    </div>
                </a>

                <div class="auth-marca-conteudo">
                    <span class="tag-sobre">Área do membro</span>
                    <h1>Bem-vindo de volta.</h1>
                    <p>Entre com sua conta do LSD pra acompanhar projetos, atualizar seu perfil na equipe e acessar a área restrita do laboratório.</p>
                </div>

                <a href="index.html" class="auth-marca-voltar">
                    <i class="fas fa-arrow-left"></i> Voltar ao site
                </a>
            </aside>

            <main class="auth-form-painel">
                <div class="auth-card">
                    <div class="auth-card-topo">
                        <h2>Entrar</h2>
                        <p>Ainda não tem conta? <a href="login.html">Cadastre-se</a></p>
                    </div>

                    <div class="auth-mensagem" id="login-mensagem"></div>

                    <form id="form-login" novalidate>
                        <div class="campo">
                            <label for="email">E-mail</label>
                            <div class="campo-input">
                                <input type="email" id="email" name="email" placeholder="seu.nome@aluno.ifce.edu.br" autocomplete="email" required>
                            </div>
                            <span class="campo-erro" id="email-erro"></span>
                        </div>

                        <div class="campo">
                            <label for="senha">Senha</label>
                            <div class="campo-input">
                                <input type="password" id="senha" name="senha" placeholder="Sua senha" autocomplete="current-password" required>
                                <button type="button" class="campo-senha-toggle" data-alvo="senha" aria-label="Mostrar senha">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            <span class="campo-erro" id="senha-erro"></span>
                        </div>

                        <div class="campo-linha-opcoes">
                            <label class="campo-lembrar">
                                <input type="checkbox" id="lembrar" name="lembrar">
                                Lembrar de mim
                            </label>
                            <a href="recuperar-senha.html" class="link-esqueci">Esqueci minha senha</a>
                        </div>

                        <button type="submit" class="btn-auth">
                            <span class="spinner"></span>
                            <span class="btn-auth-texto">Entrar</span>
                        </button>
                    </form>

                    <p class="auth-card-rodape">
                        <a href="index.html"><i class="fas fa-arrow-left"></i> Voltar ao site</a>
                    </p>
                </div>
            </main>

        </div>

        <script src="./src/js/auth.js"></script>
    </body>
</html>
