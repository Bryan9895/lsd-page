<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="./src/css/styles.css">
    <link rel="stylesheet" href="./src/css/quadro.css">
    <link rel="stylesheet" href="./src/css/perfil.css">
    <title>Meu Perfil — LSD</title>
</head>
<body class="dash-body">
    <header class="dash-nav">
        <div class="dash-nav-logo">
            <img src="./src/images/LOGO_LSD.svg" alt="Logo LSD">
            <span>LSD <strong>Perfil</strong></span>
        </div>
        <nav class="dash-nav-links">
            <a href="index.html"><i class="fas fa-house"></i> Início</a>
            <a href="quadro.html"><i class="fas fa-columns"></i> Quadro</a>
            <a href="#" id="logoutLink"><i class="fas fa-right-from-bracket"></i>Sair</a>
        </nav>
    </header>

    <main class="perfil-main">
        <div class="perfil-container">
            <!-- Lateral Esquerda: Info do Usuário -->
            <aside class="perfil-sidebar">
                <div class="perfil-avatar-wrapper">
                    <img src="./src/images/default-avatar.png" alt="Avatar" id="perfilAvatar" class="perfil-avatar">
                    <label for="foto" class="btn-trocar-foto">
                        <i class="fas fa-camera"></i> Trocar
                        <input type="file" id="foto" accept="image/*" hidden>
                    </label>
                </div>
                <h2 id="perfilNome">Carregando...</h2>
                <p id="perfilFuncao" class="tag-funcao">Membro</p>
                
                <div id="adminBadge" class="admin-badge" hidden>
                    <i class="fas fa-shield-alt"></i> Administrador
                </div>
                
                <div id="adminMenu" class="admin-menu" hidden>
                    <a href="admin.html" class="btn-admin" style="text-decoration: none;"><i class="fas fa-users"></i> Gerenciar Membros</a>
                </div>
            </aside>

            <!-- Direita: Formulário de Edição -->
            <section class="perfil-conteudo">
                <h2>Configurações do Perfil</h2>
                <p>Mantenha seus dados atualizados para a equipe.</p>
                
                <div id="mensagemPerfil"></div>

                <form id="formPerfil">
                    <label>E-mail de Contato
                        <input type="email" id="email" required>
                    </label>

                    <label>Biografia (Sua área de atuação no laboratório)
                        <textarea id="bio" maxlength="160" rows="3" placeholder="Escreva um pouco sobre você..."></textarea>
                    </label>

                    <div class="linha-inputs">
                        <label>Instagram
                            <div class="input-icone">
                                <i class="fab fa-instagram"></i>
                                <input type="text" id="instagram" placeholder="@seuusuario">
                            </div>
                        </label>

                        <label>GitHub
                            <div class="input-icone">
                                <i class="fab fa-github"></i>
                                <input type="text" id="github" placeholder="Seu usuário no Github">
                            </div>
                        </label>
                    </div>

                    <div class="acoes-form">
                        <button type="submit" class="btn-salvar" id="btnSalvar">Salvar Alterações</button>
                    </div>
                </form>
            </section>
        </div>
    </main>
    <script src="./src/js/perfil.js"></script>
</body>
</html>
