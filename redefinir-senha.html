<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="referrer" content="no-referrer">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./src/css/styles.css">
        <link rel="stylesheet" href="./src/css/auth.css">
        <title>Redefinir senha — LSD</title>
    </head>

    <body class="auth-body">
        <div class="auth-wrapper">

            <aside class="auth-marca">
                <a href="index.html" class="auth-marca-logo">
                    <img src="./src/images/LOGO_LSD.svg" alt="Logo LSD">
                    <div class="logo-subtexto">
                        <span>Sistemas</span>
                        <span>&amp; Dados</span>
                    </div>
                </a>

                <div class="auth-marca-conteudo">
                    <span class="tag-sobre">Área do membro</span>
                    <h1>Um novo começo.</h1>
                    <p>Escolha uma nova senha de 8 a 128 caracteres para sua conta.</p>
                </div>

                <a href="index.html" class="auth-marca-voltar">
                    <i class="fas fa-arrow-left"></i> Voltar ao site
                </a>
            </aside>

            <main class="auth-form-painel">
                <div class="auth-card">
                    <div class="auth-card-topo">
                        <h2>Redefinir senha</h2>
                        <p>Lembrou a senha? <a href="entrar-login.html">Voltar para o login</a></p>
                    </div>

                    <div class="auth-mensagem" id="redefinir-mensagem" role="status" aria-live="polite"></div>

                    <form id="form-redefinir" novalidate>
                        <div class="campo">
                            <label for="senha">Nova senha</label>
                            <div class="campo-input"><input type="password" id="senha" autocomplete="new-password" minlength="8" maxlength="128" required></div>
                        </div>
                        <div class="campo">
                            <label for="confirmar-senha">Confirmar nova senha</label>
                            <div class="campo-input"><input type="password" id="confirmar-senha" autocomplete="new-password" minlength="8" maxlength="128" required></div>
                        </div>
                        <p><a href="recuperar-senha.html">Solicitar outro link de recuperação</a></p>

                        <button type="submit" class="btn-auth">
                            <span class="spinner"></span>
                            <span class="btn-auth-texto">Salvar nova senha</span>
                        </button>
                    </form>

                    <p class="auth-card-rodape">
                        <a href="entrar-login.html"><i class="fas fa-arrow-left"></i> Voltar para o login</a>
                    </p>
                </div>
            </main>

        </div>

        <script src="./src/js/auth.js"></script>
    </body>
</html>
