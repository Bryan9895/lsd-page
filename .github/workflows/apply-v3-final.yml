name: Aplicar correções finais V3

on:
  push:
    branches:
      - codex/v3-stabilization-final-fixes

concurrency:
  group: v3-stabilization-final-fixes
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  aplicar-e-validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v3-stabilization-final-fixes
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Aplicar alterações V3
        run: python tools/apply_v3_stabilization.py
      - name: Validar Python
        run: python -m unittest discover -s tests -q
      - name: Validar JavaScript
        run: |
          for file in src/js/*.js; do node --check "$file"; done
      - name: Commitar arquivos gerados
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app.py dashboard.html src/js/dashboard.js src/js/dashboard-base.js src/js/script.js src/js/script-base.js docs/ESTABILIZACAO_V3.md tests/test_password_reset.py
          git commit -m "feat: aplicar correções finais da estabilização V3"
          git push origin HEAD:codex/v3-stabilization-final-fixes
