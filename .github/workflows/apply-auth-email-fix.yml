name: Aplicar correção de autenticação e e-mail

on:
  push:
    branches:
      - codex/v3-stabilization-final-fixes

concurrency:
  group: auth-email-fix
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  aplicar-e-validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v3-stabilization-final-fixes
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Aplicar correções
        run: python tools/apply_auth_email_fix.py
      - name: Ajustar teste sem depender da ordem do BCC
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_password_reset.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "self.assertEqual(send.call_args.args[1], ['admin@example.com', 'member@example.com'])",
              "self.assertCountEqual(send.call_args.args[1], ['admin@example.com', 'member@example.com'])",
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Testar API e integração
        run: python -m unittest discover -s tests -q
      - name: Verificar sintaxe JavaScript
        run: |
          for file in src/js/*.js; do node --check "$file"; done
      - name: Commitar arquivos gerados
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.example backend/v3_features.py src/js/auth.js src/js/dashboard-base.js src/js/script-base.js src/js/v3-public.js src/js/v3-dashboard.js src/js/projetos.js tests/test_password_reset.py tests/test_v3_stabilization.py tests/test_auth_storage.py
          git commit -m "fix: estabilizar login cadastro e comunicados por email"
          git push origin HEAD:codex/v3-stabilization-final-fixes
