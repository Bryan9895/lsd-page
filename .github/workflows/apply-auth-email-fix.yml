name: Validar correção de autenticação e e-mail

on:
  push:
    branches:
      - codex/v3-stabilization-final-fixes

concurrency:
  group: auth-email-final
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v3-stabilization-final-fixes
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Corrigir fallback do portfólio
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/js/projetos.js')
          text = path.read_text(encoding='utf-8')
          old = 'function obterTokenProjeto() {\n    try { const value = obterTokenProjeto(); if (value) return value; } catch (_) {}'
          new = 'function obterTokenProjeto() {\n    try { const value = localStorage.getItem(TOKEN_KEY); if (value) return value; } catch (_) {}'
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Testar API e integração
        run: python -m unittest discover -s tests -q
      - name: Verificar JavaScript e autenticação
        run: |
          for file in src/js/*.js; do node --check "$file"; done
          grep -F 'function salvarTokenSeguro(token)' src/js/auth.js
          grep -F 'sessionStorage.setItem(TOKEN_KEY, token)' src/js/auth.js
          grep -F 'redirecionarSeguro("dashboard.html")' src/js/auth.js
          grep -F 'const value = localStorage.getItem(TOKEN_KEY)' src/js/projetos.js
          grep -F 'sessionStorage.getItem(TOKEN_KEY)' src/js/projetos.js
          ! grep -F 'const value = obterTokenProjeto()' src/js/projetos.js
      - name: Commitar correção pendente
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/js/projetos.js
          git commit -m "fix: corrigir fallback de sessão no portfólio"
          git push origin HEAD:codex/v3-stabilization-final-fixes
