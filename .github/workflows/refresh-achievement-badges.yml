name: Refinar conquistas e reações

on:
  push:
    paths:
      - "tools/update_achievements_ui.py"
      - ".github/workflows/refresh-achievement-badges.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-ui-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar melhorias
        run: python tools/update_achievements_ui.py

      - name: Commit das melhorias
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/images/conquistas src/js/dashboard.js src/css/dashboard.css
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "feat: refinar conquistas vetoriais e seletor de reações"
          git push
