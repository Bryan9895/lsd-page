              count=1
          )
          readme = readme.replace('# Versão atual — 2.5.4', '# Versão atual — 2.5.7', 1)

          if '## Novidades da 2.5.7' not in readme:
              marcador_readme = '# Versão atual — 2.5.7\n\n'
              novidades = '''## Novidades da 2.5.7\n\n| Área | Atualização |\n|---|---|\n| Conquistas no perfil | O nome de cada conquista fica sempre visível abaixo do selo no perfil público. |\n| Detalhes da conquista | Clique ou teclado abre um modal inspirado nos achievements do GitHub, com selo ampliado, nome, descrição, raridade, data de desbloqueio, percentual global e histórico. |\n| Estatísticas | A API do perfil passa a informar quantos membros desbloquearam cada conquista e o percentual correspondente. |\n| Acessibilidade | Selos podem ser abertos com `Enter`/`Espaço`, o modal fecha com `Esc` ou clique fora e devolve o foco ao selo. |\n| Visual | Modal responsivo, compatível com tema escuro e adaptado para bottom sheet em celulares. |\n| Conquistas e reações | Mantidos os selos SVG circulares e o seletor de emotes sob demanda introduzidos na linha 2.5.x. |\n\n'''
              if marcador_readme not in readme:
                  raise SystemExit('Cabeçalho da versão atual não encontrado no README.')
              readme = readme.replace(marcador_readme, marcador_readme + novidades, 1)

          readme_path.write_text(readme, encoding='utf-8')
          PY

      - name: Validar arquivos
        shell: bash
        run: |
          python -m py_compile backend/app.py
          node --check src/js/dashboard.js
          grep -q "conquista-detalhe-overlay" src/css/dashboard.css
          grep -q "Versão atual — 2.5.7" README.md
          grep -q "percentual_desbloqueio" backend/app.py

      - name: Commit V2.5.7
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app.py src/js/dashboard.js src/css/dashboard.css README.md
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit \
            -m "V2.5.7 — detalhes interativos de conquistas" \
            -m "Funcionalidade aplicada: nomes visíveis abaixo dos selos e modal inspirado no GitHub ao clicar em uma conquista, exibindo descrição, raridade, data, percentual de desbloqueio e histórico; README atualizado para a versão 2.5.7."
          git push origin main
