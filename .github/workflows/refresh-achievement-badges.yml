@media (prefers-reduced-motion: reduce) {
    .conquista-detalhe-overlay,
    .conquista-detalhe-modal,
    .perfil-publico .conquista-item {
        transition: none !important;
    }
}

'''
              css = css.replace(marcador_css, modal_css + marcador_css, 1)

          css_path.write_text(css, encoding='utf-8')

          # ------------------------------------------------------------
          # README: versão e descrição da funcionalidade aplicada.
          # ------------------------------------------------------------
          readme_path = root / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')

          readme = readme.replace(
              '![Version](https://img.shields.io/badge/version-2.5.4-blue)',
