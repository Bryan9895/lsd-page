<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
        <link rel="stylesheet" href="./src/css/styles.css">
        <link rel="stylesheet" href="./src/css/quadro.css">
        <title>Quadro do Projeto — LSD</title>
    </head>

    <body class="dash-body">

        <header class="dash-nav">
            <div class="dash-nav-logo">
                <img src="./src/images/LOGO_LSD.svg" alt="Logo LSD">
                <span>L<strong>SD</strong></span>
            </div>
            <nav class="dash-nav-links">
                <a href="index.html"><i class="fas fa-arrow-left"></i> Início</a>
                <a href="entrar-login.html" id="logoutLink"><i class="fas fa-right-from-bracket"></i> Sair</a>
            </nav>
        </header>

        <main class="dash-main">

            <div class="dash-header">
                <div>
                    <span class="tag-sobre">Painel do membro</span>
                    <h1>Quadro do Projeto</h1>
                    <p>Acompanhe o andamento dos projetos do LSD e organize as tarefas em cards.</p>
                </div>
                <button class="btn-novo-card" id="btnNovoCard"><i class="fas fa-plus"></i> Novo card</button>
            </div>

            <div class="dash-stats" id="dashStats"></div>

            <div class="kanban-board">

                <section class="kanban-coluna" data-status="afazer">
                    <header class="kanban-coluna-header">
                        <span class="kanban-dot afazer"></span>
                        <h2>A Fazer</h2>
                        <span class="kanban-contador" id="contador-afazer">0</span>
                    </header>
                    <div class="kanban-lista" id="lista-afazer" data-status="afazer"></div>
                </section>

                <section class="kanban-coluna" data-status="andamento">
                    <header class="kanban-coluna-header">
                        <span class="kanban-dot andamento"></span>
                        <h2>Em Andamento</h2>
                        <span class="kanban-contador" id="contador-andamento">0</span>
                    </header>
                    <div class="kanban-lista" id="lista-andamento" data-status="andamento"></div>
                </section>

                <section class="kanban-coluna" data-status="concluido">
                    <header class="kanban-coluna-header">
                        <span class="kanban-dot concluido"></span>
                        <h2>Concluído</h2>
                        <span class="kanban-contador" id="contador-concluido">0</span>
                    </header>
                    <div class="kanban-lista" id="lista-concluido" data-status="concluido"></div>
                </section>

            </div>

        </main>

        <!-- Modal: criar/editar card -->
        <div class="modal-overlay" id="modalOverlay" hidden>
            <div class="modal-card">
                <button class="modal-fechar" id="modalFechar" aria-label="Fechar">&times;</button>
                <h2 id="modalTitulo">Novo card</h2>

                <form id="formCard">
                    <label for="cardTitulo">Título
                        <input type="text" id="cardTitulo" maxlength="60" placeholder="Nome do projeto" required>
                    </label>

                    <label for="cardDescricao">Descrição
                        <textarea id="cardDescricao" maxlength="220" placeholder="Detalhes da tarefa..."></textarea>
                    </label>

                    <div class="modal-linha">
                        <label for="cardStatus">Coluna
                            <select id="cardStatus">
                                <option value="afazer">A Fazer</option>
                                <option value="andamento">Em Andamento</option>
                                <option value="concluido">Concluído</option>
                            </select>
                        </label>

                        <label for="cardCor">Cor
                            <select id="cardCor">
                                <option value="amarelo">Amarelo</option>
                                <option value="azul">Azul</option>
                                <option value="rosa">Rosa</option>
                                <option value="verde">Verde</option>
                                <option value="lilas">Lilás</option>
                            </select>
                        </label>
                    </div>

                    <div class="modal-acoes">
                        <button type="button" class="btn-cancelar" id="modalCancelar">Cancelar</button>
                        <button type="submit" class="btn-salvar">Salvar</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Modal: confirmar exclusão -->
        <div class="modal-overlay" id="confirmOverlay" hidden>
            <div class="modal-card modal-confirm">
                <p><i class="fas fa-triangle-exclamation"></i> Tem certeza que quer excluir este card? Essa ação não pode ser desfeita.</p>
                <div class="modal-acoes">
                    <button class="btn-cancelar" id="confirmCancelar">Cancelar</button>
                    <button class="btn-excluir" id="confirmExcluir">Excluir</button>
                </div>
            </div>
        </div>

        <script src="./src/js/quadro.js"></script>
    </body>
</html>
